---
repos:
  - repo: https://github.com/norwoodj/helm-docs
    rev:  "v1.14.2"
    hooks:
      - id: helm-docs
        args:
          # Charts live at the repository root (dexidp/, pinniped/), not under a `charts` directory
          - --chart-search-root=.
          - --template-files=README.md.gotmpl