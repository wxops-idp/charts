suite: externalsecret
templates:
  - templates/externalsecret.yaml
values:
  - ../values-test.yaml
tests:
  - it: renders one ExternalSecret that owns the Secret the Deployment reads
    release:
      name: portal
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: portal-wxops-portal-secrets
      - equal:
          path: spec.target.name
          value: portal-wxops-portal-secrets
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.secretStoreRef.name
          value: wxops-openbao
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore

  - it: maps each environment variable to a property of the secret at the path
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: OIDC_CLIENT_SECRET
            remoteRef:
              key: wxops/portal
              property: oidc_client_secret
      - contains:
          path: spec.data
          content:
            secretKey: SESSION_SECRET
            remoteRef:
              key: wxops/portal
              property: session_secret
      - notExists:
          path: spec.dataFrom

  - it: reads extra secrets from the same path
    set:
      externalSecret.properties:
        OIDC_CLIENT_SECRET: oidc_client_secret
        SESSION_SECRET: session_secret
        GITEA_TOKEN: gitea_token
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: GITEA_TOKEN
            remoteRef:
              key: wxops/portal
              property: gitea_token

  - it: extracts the whole secret when no properties are listed
    set:
      externalSecret.properties: null
      externalSecret.path: apps/portal
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: apps/portal
      - notExists:
          path: spec.data

  - it: uses the secret name and API version from values
    set:
      externalSecret.secretName: portal-env
      externalSecret.apiVersion: external-secrets.io/v1beta1
      externalSecret.refreshInterval: 5m
    asserts:
      - equal:
          path: metadata.name
          value: portal-env
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1
      - equal:
          path: spec.refreshInterval
          value: 5m

  - it: renders nothing when disabled
    set:
      externalSecret.enabled: false
      existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0
