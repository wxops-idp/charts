{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "wxops-portal.secretName" . }}
  labels:
    {{- include "wxops-portal.labels" . | nindent 4 }}
  {{- with $es.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "wxops-portal.secretName" . }}
    creationPolicy: Owner
  {{- if $es.properties }}
  data:
    {{- range $envName, $property := $es.properties }}
    - secretKey: {{ $envName }}
      remoteRef:
        key: {{ $es.path }}
        property: {{ $property }}
    {{- end }}
  {{- else }}
  dataFrom:
    - extract:
        key: {{ $es.path }}
  {{- end }}
{{- end }}
