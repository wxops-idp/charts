suite: extra ExternalSecrets
templates:
  - templates/externalsecret.yaml
values:
  - ../values-test.yaml
tests:
  - it: renders nothing by default (the env example is disabled)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an enabled entry with its target name
    set:
      externalSecrets.env.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: dex-env
      - equal:
          path: spec.secretStoreRef.name
          value: dex-openbao

  - it: names the Secret after the release when target.name is not set
    release:
      name: idp
    set:
      externalSecrets.env.enabled: true
      externalSecrets.env.target: null
    asserts:
      - equal:
          path: metadata.name
          value: idp-dex-env

  - it: fails when an entry has neither data nor dataFrom
    set:
      externalSecrets.env.enabled: true
      externalSecrets.env.data: null
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.env needs `data` or `dataFrom`"

  - it: fails when an entry has no secret store
    set:
      externalSecrets.env.enabled: true
      externalSecretDefaults.secretStoreRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: "externalSecrets.env: set `secretStoreRef.name` or `externalSecretDefaults.secretStoreRef.name`"
