{{- if .Values.dynamicConfig.enabled }}
{{- $dc := .Values.dynamicConfig }}
{{- if .Values.dex.configSecret.create }}
{{- fail "dynamicConfig.enabled=true needs dex.configSecret.create=false, otherwise Dex creates its own config Secret" }}
{{- end }}
{{- if ne (.Values.dex.configSecret.name | toString) $dc.secretName }}
{{- fail (printf "dex.configSecret.name (%q) must equal dynamicConfig.secretName (%q)" .Values.dex.configSecret.name $dc.secretName) }}
{{- end }}
{{- $store := mergeOverwrite (deepCopy .Values.externalSecretDefaults.secretStoreRef) (default dict $dc.secretStoreRef) }}
{{- if not $store.name }}
{{- fail "dynamicConfig needs a store: set externalSecretDefaults.secretStoreRef.name or dynamicConfig.secretStoreRef.name" }}
{{- end }}
{{- $base := toJson $dc.base }}
{{- if contains "`" $base }}
{{- fail "dynamicConfig.base must not contain backticks, they would break the ESO template" }}
{{- end }}
{{- $tmpl := .Files.Get "files/config.yaml.tmpl" | replace "__BASE_JSON__" $base }}
---
apiVersion: {{ .Values.externalSecretsApiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $dc.secretName }}
  namespace: {{ include "dexidp.namespace" . }}
  labels:
    {{- include "dexidp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $dc.refreshInterval | default .Values.externalSecretDefaults.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: {{ $dc.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yaml: |
          {{- $tmpl | nindent 10 }}
  dataFrom:
    - find:
        path: {{ $dc.sources.connectors.path | quote }}
        name:
          regexp: {{ $dc.sources.connectors.nameRegexp | default ".*" | quote }}
      rewrite:
        - regexp:
            source: "^(.*)$"
            target: "connector_$1"
    - find:
        path: {{ $dc.sources.clients.path | quote }}
        name:
          regexp: {{ $dc.sources.clients.nameRegexp | default ".*" | quote }}
      rewrite:
        - regexp:
            source: "^(.*)$"
            target: "client_$1"
    {{- if $dc.sources.users.enabled }}
    - find:
        path: {{ $dc.sources.users.path | quote }}
        name:
          regexp: {{ $dc.sources.users.nameRegexp | default ".*" | quote }}
      rewrite:
        - regexp:
            source: "^(.*)$"
            target: "user_$1"
    {{- end }}
{{- end }}
