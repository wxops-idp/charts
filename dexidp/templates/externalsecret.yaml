{{- range $key, $es := .Values.externalSecrets }}
{{- if or (not (hasKey $es "enabled")) $es.enabled }}
{{- if not (or $es.data $es.dataFrom) }}
{{- fail (printf "externalSecrets.%s needs `data` or `dataFrom`" $key) }}
{{- end }}
{{- $name := include "dexidp.externalSecretName" (dict "root" $ "key" $key "es" $es) }}
{{- $store := mergeOverwrite (deepCopy $.Values.externalSecretDefaults.secretStoreRef) (default dict $es.secretStoreRef) }}
{{- if not $store.name }}
{{- fail (printf "externalSecrets.%s: set `secretStoreRef.name` or `externalSecretDefaults.secretStoreRef.name`" $key) }}
{{- end }}
{{- $target := mergeOverwrite (dict "name" $name "creationPolicy" "Owner") (default dict $es.target) }}
---
apiVersion: {{ $.Values.externalSecretsApiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "dexidp.namespace" $ }}
  labels:
    {{- include "dexidp.labels" $ | nindent 4 }}
  {{- with $es.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval | default $.Values.externalSecretDefaults.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    {{- toYaml $target | nindent 4 }}
  {{- with $es.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
