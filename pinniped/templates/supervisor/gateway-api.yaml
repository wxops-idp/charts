{{- $gateway := include "pinniped.gatewayAPI" (dict "root" . "component" "supervisor") | fromYaml -}}
{{- if and .Values.supervisor.enabled $gateway.enabled }}
apiVersion: {{ $gateway.apiVersion }}
kind: {{ .Values.supervisor.gatewayAPI.routeKind }}
metadata:
  name: {{ default (printf "%s-gateway-route" (include "pinniped.componentName" (dict "root" . "component" "supervisor"))) .Values.supervisor.gatewayAPI.routeName | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "pinniped.componentNamespace" (dict "root" . "component" "supervisor") }}
  labels:
{{ include "pinniped.componentLabels" (dict "root" . "component" "supervisor" "componentValues" .Values.supervisor) | indent 4 }}
{{- with .Values.supervisor.gatewayAPI.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  parentRefs:
{{- if not $gateway.parentRefs }}
{{- fail "supervisor.gatewayAPI.parentRefs (or global.gatewayAPI.parentRefs) is required when the Gateway API route is enabled" }}
{{- end }}
{{ toYaml $gateway.parentRefs | indent 4 }}
{{- with $gateway.hostnames }}
  hostnames:
{{ toYaml . | indent 4 }}
{{- end }}
  rules:
    - backendRefs:
        - name: {{ include "pinniped.supervisor.gatewayServiceName" . }}
          port: {{ .Values.supervisor.gatewayAPI.service.port }}
{{- end }}
